services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: userapp
      POSTGRES_PASSWORD: change-me
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U userapp -d userdb"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/userdb
      DB_USERNAME: userapp
      DB_PASSWORD: change-me
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-change-this-secret-key-32bytes-minimum}
      DEMO_USERNAME: ${DEMO_USERNAME:-demo}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo12345}
      PROFILE_SERVICE_URL: ${PROFILE_SERVICE_URL:-http://host.docker.internal:8099}
volumes:
  postgres_data:
